# Настройки приложения
spring.application.name=moex-collector
server.port=8080

# Настройки базы данных (закомментируйте если БД не нужна)
#spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/trading_data
spring.datasource.url=jdbc:postgresql://localhost:5432/trading_data
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA настройки
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Настройки MOEX API
moex.api.base-url=https://iss.moex.com/iss
moex.api.securities=SBER,GAZP,LKOH,ROSN
moex.collection.interval=60000

# Логирование
logging.level.com.trading=INFO
logging.file.name=logs/collector.log